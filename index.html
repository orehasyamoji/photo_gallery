<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171717"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Photo Frame</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head>
<body>
<section id="start" class="start screen" hidden><header class="start-header"><div class="logo">Photo Frame</div><div class="index">YOUR PHOTOGRAPHS</div></header><main class="start-main"><div class="intro"><p class="kicker">BEGIN</p><h1>写真を開く</h1><p>見たい写真の選び方を選んでください。</p></div><div class="choices"><button id="choose-folder" class="choice" type="button"><span class="choice-top">FOLDER</span><span class="choice-bottom"><span class="choice-title">フォルダを開く</span><span class="choice-description">ひとつのフォルダを選び、中の写真をまとめて見る。</span></span></button><button id="choose-files" class="choice" type="button"><span class="choice-top">FILES</span><span class="choice-bottom"><span class="choice-title">ファイルを開く</span><span class="choice-description">写真を選んで見る。あとからギャラリーに追加できる。</span></span></button></div><button id="resume" class="resume" type="button" hidden>現在の写真に戻る →</button></main><footer class="start-footer"><span>PHOTO FRAME</span><span>OPEN · VIEW · ENJOY</span></footer></section>
<section id="gallery" class="gallery screen" hidden><header class="gallery-header"><div class="gallery-title">Gallery</div><div class="gallery-actions"><span id="count">00 PHOTOGRAPHS</span><button id="add-files" class="text-button" type="button" hidden>ファイルを追加</button><button id="go-start" class="text-button" type="button">写真を開く</button></div></header><div class="rule"></div><main id="grid" class="grid" aria-label="写真一覧"></main><footer class="gallery-footer"><span id="album-note"></span><nav class="pages" aria-label="ページ切り替え"><button id="prev" type="button" aria-label="前のページ">←</button><span id="page">01 / 01</span><button id="next" type="button" aria-label="次のページ">→</button></nav></footer></section>
<section id="detail" class="detail screen" hidden><div class="detail-wrap"><figure id="detail-figure"><img id="large" alt=""><figcaption id="caption" class="caption"><span id="camera" class="camera"><span id="brand" class="brand"></span><span id="model" class="model"></span></span><span id="date" class="date"></span></figcaption></figure></div></section>
<input id="folder-input" class="visually-hidden" type="file" accept="image/jpeg,.jpg,.jpeg" webkitdirectory multiple><input id="files-input" class="visually-hidden" type="file" accept="image/jpeg,.jpg,.jpeg" multiple><div id="status" class="status" role="status" aria-live="polite" hidden></div>
</body></html>
